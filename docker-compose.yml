services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: vaultlink-bot:local
    container_name: vaultlink-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ['CMD', 'node', 'dist/healthcheck.js']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
